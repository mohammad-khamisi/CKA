deploymentMode: SingleBinary

loki:
  auth_enabled: false
  configStorageType: Secret
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-khamisi
      ruler: loki-khamisi
      admin: loki-khamisi
    s3:
      region: YOUR_REGION
      accessKeyId: YOUR_ACCESS_KEY
      secretAccessKey: YOUR_SECRET_KEY
      s3ForcePathStyle: false

singleBinary:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: master
  persistence:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 200Mi}
    limits: {memory: 512Mi}
  extraEnv:
    - name: GOMEMLIMIT
      value: 450MiB
  extraVolumes:
    - name: loki-data
      emptyDir: {}
  extraVolumeMounts:
    - name: loki-data
      mountPath: /var/loki

chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
ruler:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
